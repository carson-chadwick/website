<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paradise Donut Company</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="#">Paradise Donuts</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero text-center text-white d-flex align-items-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Fresh. Sweet. Delicious.</h1>
            <p class="lead">Made fresh daily with love at Paradise Donut Company.</p>
            <a href="#menu" class="btn btn-light btn-lg text-danger fw-bold mt-3">View Menu</a>
        </div>
    </section>

    <!-- DONUT MENU SECTION -->
    <main class="container py-5" id="menu">
        <h2 class="text-center mb-4 fw-bold text-danger">Our Donuts</h2>

        <div id="donut-list" class="row g-4">
            <!-- Cards inserted here by JavaScript -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-light text-center py-3 mt-4 border-top">
        <p class="mb-0">&copy; 2025 Paradise Donut Company</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
